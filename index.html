<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor</title>
    <style>
        body {
            background-color: #ffcc99;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .rosa {
            position: absolute;
            width: 50px;
            height: 50px;
            background-image: url('flor.png');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            animation: girar 5s linear infinite, brillo 1.5s infinite alternate;
        }
        
        @keyframes girar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes brillo {
            from { filter: drop-shadow(0 0 5px rgba(255, 255, 0, 0.7)); }
            to { filter: drop-shadow(0 0 15px rgba(255, 255, 0, 1)); }
        }
    </style>
</head>
<body>
    <script>
        const mensajes = [
            "Eres mi sol en días grises", "Tu sonrisa ilumina mi mundo", "Te amo más de lo que puedo decir", "Cada día a tu lado es un regalo", 
            "Eres mi inspiración", "Mi amor por ti es infinito", "Eres mi persona favorita", "A tu lado todo es mejor", "Te elijo siempre", 
            "Eres el sueño del que nunca quiero despertar", "Tus abrazos son mi lugar favorito", "Cada beso tuyo es magia", "Tú haces que mi corazón lata más fuerte",
            "Eres mi felicidad", "Te amo más de lo que las palabras pueden expresar", "Cada segundo contigo es un tesoro", "Eres mi destino", "Eres perfecta para mí",
            "Amarte es mi mayor alegría", "Siempre estaré a tu lado", "Eres mi paz y mi aventura", "Tus ojos son mi universo", "Eres mi más bella casualidad",
            "Amo cada detalle de ti", "Contigo todo es posible", "Siempre serás mi elección", "Eres mi mejor historia de amor", "Tu amor es mi refugio",
            "No hay día que no piense en ti", "Tu amor me hace mejor", "Eres mi melodía favorita", "Tu ternura me enamora", "Te amo sin medida",
            "Cada día me haces más feliz", "Siempre serás mi hogar", "Eres mi mejor capítulo", "Mi amor por ti es eterno", "Tu amor es mi fortuna",
            "Eres la casualidad más bonita", "Tu amor es mi motor", "Cada día contigo es un sueño hecho realidad", "Amo amarte", "Eres la flor más hermosa",
            "Eres mi historia favorita", "Siempre en mi corazón", "Eres la luz de mi vida", "Tus besos son mi adicción", "Nuestro amor es único",
            "Amo cada instante contigo", "Eres mi milagro", "Eres mi otra mitad", "Mi amor por ti crece cada día", "Siempre serás mi prioridad",
            "Eres mi cielo en la tierra", "Siempre en mi pensamiento", "Amarte es mi felicidad", "Eres mi destino y mi suerte", "Nuestro amor es infinito",
            "Eres la estrella que ilumina mi vida", "Contigo, el mundo es perfecto", "Tu amor es mi mayor tesoro", "Eres mi poema favorito",
            "Nuestro amor es eterno", "Eres el latido de mi corazón", "Cada día contigo es un nuevo motivo para sonreír", "Eres mi para siempre",
            "Eres la mejor decisión de mi vida", "Te amo con cada parte de mi ser", "Tu amor es mi paz", "No existe un lugar mejor que a tu lado",
            "Siempre quiero estar contigo", "Eres la brisa que acaricia mi alma", "Cada beso tuyo es un pedacito de cielo", "Nuestro amor es el mejor viaje",
            "Eres la dulzura que endulza mis días", "Te amo más allá de las estrellas", "Siempre en mi alma", "Tú y yo, por siempre juntos",
            "Tu amor es mi mejor regalo", "Cada latido mío te pertenece", "Te amo con locura", "Siempre serás mi gran amor"
        ];
        
        function crearRosas() {
            for (let i = 0; i < 80; i++) {
                let rosa = document.createElement("div");
                rosa.classList.add("rosa");
                document.body.appendChild(rosa);
                rosa.style.left = Math.random() * window.innerWidth + "px";
                rosa.style.top = Math.random() * window.innerHeight + "px";
                
                rosa.addEventListener("click", function () {
                    alert(mensajes[i]);
                });
            }
        }
        
        crearRosas();
    </script>
</body>
</html>
